name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: mkdir -p www assets && cp index.html manifest.json sw.js icon.jpg icon-192.png icon-512.png www/ && cp icon-only.png assets/
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0708' --iconBackgroundColorDark '#0b0708' || echo "icon step skipped"
      - run: sed -i 's/<activity /<activity android:screenOrientation="landscape" /' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: UNSTRUNG-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
